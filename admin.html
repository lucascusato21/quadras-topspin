<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#116b4f"><title>Admin | Quadras TopSpin</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/admin.css"></head><body><main><header><div class="eyebrow">Quadras TopSpin</div><h1>Painel administrativo</h1><p class="muted">Agenda, reservas, pagamentos e liberação de horários.</p></header><section id="login" class="card"><h2>Entrar</h2><form id="loginForm"><label for="email">E-mail</label><input id="email" type="email" required autocomplete="username"><label for="senha">Senha</label><input id="senha" type="password" required autocomplete="current-password"><button class="primary" type="submit">Entrar</button><p id="loginErro" class="error" aria-live="polite"></p></form></section><section id="painel" class="hidden"><div class="toolbar card"><div><strong id="adminEmail"></strong><div class="muted">Administrador</div></div><button id="sair" type="button">Sair</button></div><div class="metrics"><div class="metric"><span>Reservas do dia</span><strong id="mReservas">0</strong></div><div class="metric"><span>Confirmadas</span><strong id="mConfirmadas">0</strong></div><div class="metric"><span>Receita confirmada</span><strong id="mReceita">R$ 0,00</strong></div></div><div class="card controls"><label for="dataAgenda">Agenda do dia</label><div class="control-row"><button id="anterior" type="button">‹</button><input id="dataAgenda" type="date"><button id="proximo" type="button">›</button><button id="hoje" type="button">Hoje</button></div></div><section class="card"><div class="section-title"><div><h2>Agenda das quadras</h2><p id="dataLabel" class="muted"></p></div><button id="atualizar" type="button">Atualizar</button></div><div id="agenda" class="agenda"></div></section><section class="card"><div class="section-title"><div><h2>Reservas</h2><p class="muted">Detalhes e ações administrativas.</p></div><select id="status" aria-label="Filtrar status"><option value="">Todos</option><option value="aguardando">Aguardando</option><option value="confirmada">Confirmada</option></select></div><div id="reservas"></div><p id="vazio" class="muted hidden">Nenhuma reserva para este dia.</p></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/admin.js"></script></body></html>
